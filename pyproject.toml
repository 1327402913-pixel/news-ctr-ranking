[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-ctr-ranking"
version = "0.1.0"
description = "Leakage-safe news click ranking with temporal validation and group-aware evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "news-ctr-ranking contributors" }]
keywords = ["machine-learning", "recommender-systems", "learning-to-rank", "ctr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
ranking = ["lightgbm>=4.5"]
causal = [
  "matplotlib>=3.9",
  "pillow>=10",
  "scipy>=1.14",
  "statsmodels>=0.14",
]
decision = [
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "pillow>=10",
  "scipy>=1.14",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
news-ctr = "news_ctr.cli:main"

[project.urls]
Homepage = "https://github.com/1327402913-pixel/news-ctr-ranking"
Issues = "https://github.com/1327402913-pixel/news-ctr-ranking/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
news_ctr = ["sql/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
