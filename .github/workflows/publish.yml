      - name: Verify project
        shell: bash
        working-directory: /tmp/project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest

      - name: Publish verified project
        shell: bash
        run: |
          set -euo pipefail
          git -C /tmp/project archive HEAD > /tmp/project.tar
          mkdir /tmp/project-files
          tar -xf /tmp/project.tar -C /tmp/project-files
          rm /tmp/project-files/.github/workflows/publish.yml
          cp -R /tmp/project-files/. "$GITHUB_WORKSPACE"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish news CTR ranking project"
          git push origin HEAD:main
