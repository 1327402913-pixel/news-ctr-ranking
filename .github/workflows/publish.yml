name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m build

  ranking-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,ranking]"
      - run: python -m pytest tests/test_models.py tests/test_benchmarking.py -q
      - run: news-ctr make-synthetic --output data/synthetic --seed 42 --users 10 --articles 24 --impressions 40
      - run: news-ctr benchmark --data data/synthetic --output artifacts/ci-benchmark --models position,popularity,logistic,lightgbm --bootstrap-samples 20 --text-components 4 --seed 42
      - run: python -c "import pandas as pd; assert 'lightgbm' in set(pd.read_csv('artifacts/ci-benchmark/leaderboard.csv')['model'])"
      - run: grep -q "not an EB-NeRD benchmark" artifacts/ci-benchmark/benchmark_report.md
