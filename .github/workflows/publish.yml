name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python -m build

  ranking-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,ranking]"
      - run: python -m pytest tests/test_models.py tests/test_benchmarking.py -q
      - run: news-ctr make-synthetic --output data/synthetic --seed 42 --users 10 --articles 24 --impressions 40
      - run: news-ctr benchmark --data data/synthetic --output artifacts/ci-benchmark --models position,popularity,logistic,lightgbm --bootstrap-samples 20 --text-components 4 --seed 42
      - run: python -c "import pandas as pd; assert 'lightgbm' in set(pd.read_csv('artifacts/ci-benchmark/leaderboard.csv')['model'])"
      - run: grep -q "not an EB-NeRD benchmark" artifacts/ci-benchmark/benchmark_report.md

  decision-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,decision,causal]"
      - run: python -m pytest --cov=news_ctr --cov-report=term-missing --cov-fail-under=90
      - run: news-ctr make-synthetic --output data/ci-ranking --seed 42 --users 30 --articles 80 --impressions 180
      - run: news-ctr analyze --data data/ci-ranking --output artifacts/analytics-ci --split validation --min-cell-count 5
      - run: news-ctr make-experiment --output data/ci-rct.parquet --seed 42 --users 20000
      - run: news-ctr experiment --input data/ci-rct.parquet --output artifacts/experiment-ci --config configs/experiment-v3.json
      - run: python -c "from news_ctr.portfolio import assemble_portfolio; assemble_portfolio('artifacts/analytics-ci', 'artifacts/experiment-ci', 'artifacts/portfolio-ci')"
      - name: Verify complete and reproducible aggregate evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from news_ctr.portfolio import ANALYTICS_ARTIFACTS, EXPERIMENT_ARTIFACTS

          analytics = {path.name for path in Path("artifacts/analytics-ci").iterdir()}
          experiment = {path.name for path in Path("artifacts/experiment-ci").iterdir()}
          assert analytics == set(ANALYTICS_ARTIFACTS)
          assert experiment == set(EXPERIMENT_ARTIFACTS)
          for committed in Path("artifacts/portfolio-v3").iterdir():
              regenerated = Path("artifacts/portfolio-ci") / committed.name
              assert regenerated.is_file(), committed.name
              if committed.suffix == ".png":
                  with Image.open(committed) as expected, Image.open(regenerated) as actual:
                      expected.verify()
                      actual.verify()
                  with Image.open(committed) as expected, Image.open(regenerated) as actual:
                      assert expected.size == actual.size, committed.name
                      assert expected.mode == actual.mode, committed.name
                      assert expected.info["Description"] == actual.info["Description"]
                      assert expected.getbbox() is not None, committed.name
                      assert actual.getbbox() is not None, committed.name
                      expected_colors = expected.convert("RGB").getcolors(
                          maxcolors=expected.width * expected.height
                      )
                      actual_colors = actual.convert("RGB").getcolors(
                          maxcolors=actual.width * actual.height
                      )
                      assert expected_colors is not None and len(expected_colors) > 1
                      assert actual_colors is not None and len(actual_colors) > 1
              else:
                  assert committed.read_bytes() == regenerated.read_bytes(), committed.name
          PY
      - run: grep -q "synthetic-rct" artifacts/experiment-ci/decision_report.md
      - run: grep -qi "not production lift" artifacts/experiment-ci/decision_report.md

  causal-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,causal]"
      - name: Test causal analysis and public commands
        run: |
          python -m pytest \
            tests/test_causal.py \
            tests/test_causal_reporting.py \
            tests/test_causal_visualization.py \
            tests/test_causal_workflow.py \
            tests/test_cli.py -q
      - run: news-ctr make-quasi-experiment --output data/ci-market-panel.parquet --seed 42 --markets 60 --pre-weeks 20 --post-weeks 12
      - run: news-ctr causal-impact --input data/ci-market-panel.parquet --output artifacts/causal-ci --config configs/causal-impact-v4.json
      - name: Verify complete and reproducible causal evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from news_ctr.causal_workflow import CAUSAL_ARTIFACTS

          committed_root = Path("artifacts/causal-impact-v4")
          regenerated_root = Path("artifacts/causal-ci")
          assert tuple(sorted(path.name for path in committed_root.iterdir())) == CAUSAL_ARTIFACTS
          assert tuple(sorted(path.name for path in regenerated_root.iterdir())) == CAUSAL_ARTIFACTS
          for name in CAUSAL_ARTIFACTS:
              committed = committed_root / name
              regenerated = regenerated_root / name
              if committed.suffix == ".png":
                  with Image.open(committed) as expected, Image.open(regenerated) as actual:
                      expected.verify()
                      actual.verify()
                  with Image.open(committed) as expected, Image.open(regenerated) as actual:
                      assert expected.size == actual.size, name
                      assert expected.mode == actual.mode, name
                      assert expected.info["Description"] == actual.info["Description"]
                      assert expected.getbbox() is not None, name
                      assert actual.getbbox() is not None, name
                      expected_colors = expected.convert("RGB").getcolors(
                          maxcolors=expected.width * expected.height
                      )
                      actual_colors = actual.convert("RGB").getcolors(
                          maxcolors=actual.width * actual.height
                      )
                      assert expected_colors is not None and len(expected_colors) > 1
                      assert actual_colors is not None and len(actual_colors) > 1
              else:
                  assert committed.read_bytes() == regenerated.read_bytes(), name
          PY
      - run: grep -q "synthetic-quasi-experiment" artifacts/causal-ci/causal_report.md
      - run: grep -qi "not production lift" artifacts/causal-ci/causal_report.md
