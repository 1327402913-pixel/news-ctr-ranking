      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest

      - name: Publish verified history
        run: git push --force origin HEAD:main
